<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Document Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="bg-glow"></div>

    <header class="container">
        <div class="logo">
            <span>⚡</span> BlockVerify
        </div>
        <nav>
            <!-- Add nav items if needed -->
        </nav>
    </header>

    <main class="container hero">
        <h1>Secure Your Documents Forever</h1>
        <p>Immutable storage and instant verification using advanced blockchain technology.</p>

        <div class="app-card">
            <div class="tabs">
                <button class="tab-btn active" id="tab-upload">Upload Document</button>
                <button class="tab-btn" id="tab-verify">Verify Authenticity</button>
                <button class="tab-btn" id="tab-dashboard">Dashboard</button>
            </div>

            <!-- Upload Section -->
            <div id="upload-form">
                <div class="drop-zone" id="drop-zone">
                    <div class="icon-upload">☁️</div>
                    <p id="file-label">Drag & Drop or Click to Upload</p>
                    <input type="file" id="file-input" hidden>
                </div>
                <button class="btn-primary" id="btn-upload">Secure Document</button>
                <div id="upload-result" class="result-area hidden"></div>
            </div>

            <!-- Verify Section -->
            <div id="verify-form" class="hidden">
                <div class="form-group">
                    <label for="verify-hash">Document Hash / ID</label>
                    <input type="text" id="verify-hash" placeholder="Enter the transaction hash...">
                </div>
                <div class="drop-zone" id="verify-drop-zone" style="padding: 1rem; margin-bottom: 1rem;">
                    <p id="verify-file-label">Or click to upload file to check</p>
                    <input type="file" id="verify-file-input" hidden>
                </div>
                <button class="btn-primary" id="btn-verify">Verify Authenticity</button>
                <div id="verify-result" class="result-area hidden"></div>
            </div>

            <!-- Dashboard Section -->
            <div id="dashboard-view" class="hidden">
                <h3>Blockchain Ledger</h3>
                <div class="table-container">
                    <table id="blockchain-table">
                        <thead>
                            <tr>
                                <th>Block #</th>
                                <th>Timestamp</th>
                                <th>Hash</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>

                <h3 style="margin-top: 2rem;">Database Records</h3>
                <div class="table-container">
                    <table id="db-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>File Name</th>
                                <th>Hash</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
